h1{font:800 104px/.95 var(--disp);letter-spacing:-.03em;margin-top:18px}
h2{font:800 70px/1 var(--disp);letter-spacing:-.02em;margin-top:14px}
em{font-style:normal;color:var(--crv)}
.duo{display:grid;grid-template-columns:1fr 470px;gap:70px;align-items:center;height:100%}
.korak{display:flex;gap:16px;margin-top:20px;font:700 30px var(--tekst)}

#sat{padding:16px 30px;border-radius:999px;background:#fff;border:2px solid var(--line);font:800 50px var(--disp);font-variant-numeric:tabular-nums}

.qr{background:#fff;border-radius:32px;padding:24px;border:3px solid var(--ink);box-shadow:14px 14px 0 var(--crv)}
.qr img,.qr canvas{display:block;width:100%!important;height:auto!important}
.kod{text-align:center;margin-top:18px;font:700 20px var(--tekst);color:var(--muted)} .kod b{color:var(--ink);letter-spacing:.1em}

  igraca: ["Players:", "Igrača:", "Spieler:"], kodtxt: ["Quiz code", "Kod kviza", "Quiz-Code"],
  pobN: ["And the winners <em>are…</em>", "A pobjednici <em>su…</em>", "Und die Gewinner <em>sind…</em>"],
  odgN: ["The right <em>answers</em>", "Točni <em>odgovori</em>", "Die richtigen <em>Antworten</em>"],
  bStart: ["⏱ Start 6:00", "⏱ Kreni 6:00", "⏱ Start 6:00"], bQR: ["📱 QR code", "📱 QR kod", "📱 QR-Code"], bPob: ["🏆 Winners", "🏆 Pobjednici", "🏆 Gewinner"],
  bOdg: ["✅ Answers", "✅ Odgovori", "✅ Antworten"], bNovi: ["↺ New quiz", "↺ Novi kviz", "↺ Neues Quiz"],
  potvrda: ["New code, 0 players?", "Novi kod, 0 igrača?", "Neuer Code, 0 Spieler?"], da: ["Yes", "Da", "Ja"], ne: ["No", "Ne", "Nein"],
  prazno: ["Nobody has played yet.", "Još nitko nije igrao.", "Noch hat niemand gespielt."], bodova: ["points", "bodova", "Punkte"], kraj: ["Time's up!", "Vrijeme je isteklo!", "Zeit ist um!"] };
let J = "en"; try{ J = localStorage.getItem("hrk-host-jezik") || "en"; }catch(e){}
const I = () => ({en:0, hr:1, de:2})[J];
const t = k => TX[k][I()];

// ----- skaliranje -----
function skaliraj(){ $("pozornica").style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth/1600, innerHeight/900)})`; }
addEventListener("resize", skaliraj); skaliraj();

// ----- kod kviza (pamti se na ovom računalu dok se ne stisne „Novi kviz“) -----
const novKod = () => { const z = "ABCDEFGHJKLMNPRSTUVZ23456789"; return [...crypto.getRandomValues(new Uint8Array(6))].map(x => z[x % z.length]).join(""); };
let kod = ""; try{ kod = localStorage.getItem("hrk-host-kod") || ""; }catch(e){}
if(!/^[A-Z0-9]{6}$/.test(kod)){ kod = novKod(); try{ localStorage.setItem("hrk-host-kod", kod); }catch(e){} }
function crtajQR(){ const el = $("qr"); el.innerHTML = ""; const url = `${STRANICA}kviz-hrvatska.html?s=${kod}`; el.setAttribute("role","img"); el.setAttribute("aria-label","QR code: "+url);
  try{ new QRCode(el, {text:url, width:840, height:840, colorDark:"#141733", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.innerHTML = `<p style="font:800 20px var(--tekst);word-break:break-all">${url}</p>`; }
  $("kodTxt").textContent = kod; }

// ----- pogledi -----
let pogled = "vStart";
function pokazi(v){ pogled = v; ["vStart","vPob","vOdg"].forEach(x => $(x).classList.toggle("on", x === v));
  $("bQR").setAttribute("aria-pressed", v === "vStart"); $("bPob").setAttribute("aria-pressed", v === "vPob"); $("bOdg").setAttribute("aria-pressed", v === "vOdg");
  if(v === "vPob"){ zadnjiPotpis = ""; rezultati(true); } }

// ----- rezultati -----
let rez = {broj:0, top:[]}, zadnjiPotpis = "", brojIgraca = -1;
async function rezultati(prvi){
  try{ const r = await fetch(`${POSREDNIK}/kviz/rezultati?s=${kod}`, {cache:"no-store"}); if(!r.ok) return; rez = await r.json();
    if(rez.broj !== brojIgraca){ brojIgraca = rez.broj; document.querySelectorAll(".igraca").forEach(b => { b.textContent = rez.broj; b.classList.remove("skok"); void b.offsetWidth; b.classList.add("skok"); }); }
    if(pogled === "vPob") crtajPobjednike(prvi);
  }catch(e){}
}
setInterval(() => rezultati(false), 3000);
function prasak(el, n){ const r = el.getBoundingClientRect(), b = ["#1f43c4","#ffc800","#e1251b","#13a06b","#141733"];
  for(let k=0;k<n;k++){ const d = document.createElement("div"); d.className = "iskra"; const a = Math.random()*6.28, v = 160+Math.random()*520;
    d.style.cssText = `left:${r.left+r.width/2}px;top:${r.top+30}px;background:${b[k%5]};--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v - 200}px`; document.body.appendChild(d); setTimeout(() => d.remove(), 1700); } }
function crtajPobjednike(prvi){
  const tp = rez.top || [], potpis = J + JSON.stringify(tp); if(potpis === zadnjiPotpis) return; const animiraj = prvi || !zadnjiPotpis; zadnjiPotpis = potpis;
  if(!tp.length){ $("postolje").innerHTML = `<p class="prazno">${t("prazno")}</p>`; $("ostali").innerHTML = ""; return; }
  const med = ["🥇","🥈","🥉"]; $("postolje").innerHTML = "";
  [1,0,2].filter(k => tp[k]).forEach(k => { const el = document.createElement("div"); el.className = `stup p${k+1}`;
    el.innerHTML = `<div class="med">${med[k]}</div><div class="ime"></div><div class="bod">${tp[k].bodovi} ${t("bodova")}</div><div class="blok">${k+1}</div>`;
    el.querySelector(".ime").textContent = tp[k].ime; $("postolje").appendChild(el); setTimeout(() => el.classList.add("on"), animiraj ? [1300,400,2200][k] : 0); });
  $("ostali").innerHTML = ""; tp.slice(3,8).forEach((x,j) => { const s = document.createElement("span"); s.append(`${j+4}. ${x.ime} `); const b = document.createElement("b"); b.textContent = x.bodovi; s.append(b); $("ostali").appendChild(s); });
  if(animiraj) setTimeout(() => { const p = document.querySelector(".p1"); if(p){ prasak(p, 120); setTimeout(() => prasak(p, 80), 500); } }, 2500);
}

// ----- točni odgovori -----
function crtajOdgovore(){ const P = PIT[["en","de","hr"].indexOf(J)];
  $("odgovori").innerHTML = P.map(([q, o], k) => `<div><span>${k+1}</span><p>${q} <b>${o[TOCNO[k]]}</b></p></div>`).join(""); }

// ----- odbrojavanje 6:00 (samo za prikaz; svaki igrač ima svoj sat na mobitelu) -----
let tik = null;
function startSat(){ clearInterval(tik); const kraj = Date.now() + 360000, el = $("sat"); el.hidden = false; el.classList.remove("kraj"); pokazi("vStart");
  const f = () => { const s = Math.max(0, Math.ceil((kraj - Date.now())/1000)); el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; if(!s){ clearInterval(tik); el.classList.add("kraj"); el.textContent = t("kraj"); } };
  f(); tik = setInterval(f, 250); }

// ----- jezik -----
function postaviJezik(j){ J = ["en","hr","de"].includes(j) ? j : "en"; document.documentElement.lang = J; try{ localStorage.setItem("hrk-host-jezik", J); }catch(e){}
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if(/<em>/.test(v)) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll("#gumbi [data-j]").forEach(b => b.setAttribute("aria-pressed", b.dataset.j === J));
  crtajOdgovore(); zadnjiPotpis = ""; if(pogled === "vPob") crtajPobjednike(false); }

// ----- gumbi i tipke -----
$("bStart").onclick = startSat; $("bQR").onclick = () => pokazi("vStart"); $("bPob").onclick = () => pokazi("vPob"); $("bOdg").onclick = () => pokazi("vOdg");
$("bNovi").onclick = () => { $("potvrda").hidden = false; }; $("neNovi").onclick = () => { $("potvrda").hidden = true; };
$("daNovi").onclick = () => { $("potvrda").hidden = true; kod = novKod(); try{ localStorage.setItem("hrk-host-kod", kod); }catch(e){} brojIgraca = -1; rez = {broj:0, top:[]}; document.querySelectorAll(".igraca").forEach(b => b.textContent = 0); clearInterval(tik); $("sat").hidden = true; crtajQR(); pokazi("vStart"); };
document.querySelectorAll("#gumbi [data-j]").forEach(b => b.onclick = () => postaviJezik(b.dataset.j));
addEventListener("keydown", e => { const k = e.key.toLowerCase(); if(k === "s") startSat(); if(k === "q") pokazi("vStart"); if(k === "w" || k === "p") pokazi("vPob"); if(k === "a") pokazi("vOdg");
  if(k === "f"){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(err){} } });
// gumbi se sakriju kad se miš ne miče, da ne smetaju na projektoru
let skr; function pokaziGumbe(){ $("gumbi").classList.remove("skri"); clearTimeout(skr); skr = setTimeout(() => { if($("potvrda").hidden) $("gumbi").classList.add("skri"); }, 5000); }
addEventListener("mousemove", pokaziGumbe); addEventListener("touchstart", pokaziGumbe, {passive:true}); pokaziGumbe();

crtajQR(); postaviJezik(J); rezultati(false);
</script>
</body></html>
